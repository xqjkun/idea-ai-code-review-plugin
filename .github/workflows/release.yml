name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Test, build and publish
    runs-on: ubuntu-latest
    env:
      PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
      CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
      PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
      PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Check tag matches project version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          project_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' build.gradle.kts)"
          if [ -z "$project_version" ] || [ "$tag_version" != "$project_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match project version ${project_version:-<not found>}. Update version in build.gradle.kts first."
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Test
        run: ./gradlew --no-daemon test

      - name: Build plugin
        run: ./gradlew --no-daemon buildPlugin

      - name: Verify plugin against supported IDEA versions
        run: ./gradlew --no-daemon verifyPlugin

      - name: Create GitHub Release and upload plugin zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" build/distributions/*.zip --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" build/distributions/*.zip \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi

      - name: Check JetBrains Marketplace configuration
        id: marketplace
        shell: bash
        run: |
          if [ -n "$PUBLISH_TOKEN" ] \
            && [ -n "$CERTIFICATE_CHAIN" ] \
            && [ -n "$PRIVATE_KEY" ] \
            && [ -n "$PRIVATE_KEY_PASSWORD" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "JetBrains Marketplace publishing is enabled."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::JetBrains Marketplace publishing skipped. Configure PUBLISH_TOKEN, CERTIFICATE_CHAIN, PRIVATE_KEY and PRIVATE_KEY_PASSWORD after the first manual Marketplace upload."
          fi

      - name: Sign and publish to JetBrains Marketplace
        if: steps.marketplace.outputs.enabled == 'true'
        run: ./gradlew --no-daemon publishPlugin
